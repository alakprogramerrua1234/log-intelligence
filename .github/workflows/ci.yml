name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      # La suite de ingesta necesita Postgres de verdad: prueba `ON CONFLICT` y
      # `UNIQUE NULLS NOT DISTINCT`, que SQLite no tiene. Sin este servicio esos
      # tests se saltarían en silencio.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logintel
          POSTGRES_PASSWORD: logintel
          POSTGRES_DB: logintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # `ruff format --check` todavía no se puede exigir: el repo usa alineación
      # manual en varios ficheros y normalizarlo pide un commit propio.

      - name: Types
        run: uv run mypy src

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://logintel:logintel@localhost:5432/logintel_test
        run: uv run pytest -q

      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json \
            || (echo "::error::openapi.json desactualizado. Ejecuta scripts/export_openapi.py y commitea." && exit 1)

  web:
    name: Web (types)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generated types match the OpenAPI schema
        run: pnpm --filter web check:types

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build
