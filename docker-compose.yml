services:
  postgres:
    image: postgres:16-alpine
    container_name: logintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logintel
      POSTGRES_PASSWORD: logintel
      POSTGRES_DB: logintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Los servicios de abajo van tras un `profile`, así que `docker compose up -d`
  # sigue levantando solo Postgres, que es el flujo de desarrollo. Están aquí
  # para que el despliegue por separado sea reproducible en local.

  # docker compose --profile full up -d
  api:
    profiles: ["full"]
    build:
      context: ./apps/api
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://logintel:logintel@postgres:5432/logintel
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # Se ejecuta a demanda, no es long-running:
  # docker compose run --rm ingest --source /data/sample.csv
  ingest:
    profiles: ["tools"]
    build:
      context: ./apps/api
      target: ingest
    environment:
      DATABASE_URL: postgresql+psycopg://logintel:logintel@postgres:5432/logintel
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
